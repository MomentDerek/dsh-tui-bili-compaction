# dsh-tui-bili-compaction bundle layer.
#
# Mounted when a profile's package.json lists this package in
# `dsh.profile.bundles` (`dsh plugin --profile <name> add link:<path>`); the
# loader resolves `name` from the profile's node_modules.
#
# The row's `config` is the plugin's `PluginOptions` (see README). Native
# compaction is switched off at runtime by the plugin's preset-service guard
# (`compaction` + `toolResultPruner`), not by patching rows here: dsh-tui
# composes its presets in their own realm, so there is no row id this patch
# layer could address.
- insert:
    - id: bili-compaction
      name: dsh-tui-bili-compaction
